Dependency-free variant of samples/google_OrgChart.html:
 - no Google Charts, no jQuery, no ../util or ../thirdPartyHelpers includes
 - the org chart is rendered with plain DOM + CSS and mimics Google OrgChart behavior:
   click = select/deselect (single selection, posted back to VA), double-click = collapse/expand,
   formatted value (3rd role) rendered as HTML, tooltip (4th role) shown on hover
-->
<html>

<head>
    <meta charset="utf-8">

    <style>
        html {
            overflow: hidden;
        }

        html,
        body,
        #chart_div {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #chart_div {
            position: relative;
            border-style: none;
            border-width: 0px;
            overflow: auto;
        }

        /* ---- Org chart (styled after Google OrgChart, size: 'small') ---- */
        .oc-forest {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-width: max-content;
            padding: 6px;
            box-sizing: border-box;
            font-family: arial, helvetica, sans-serif;
            font-size: 11px;
        }

        .oc-forest ul {
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 12px 0 0 0;
            position: relative;
            list-style: none;
        }

        .oc-forest li {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 3px 0 3px;
        }

        /* horizontal connector above each child, split in two halves */
        .oc-forest li::before,
        .oc-forest li::after {
            content: "";
            position: absolute;
            top: 0;
            width: 50%;
            height: 12px;
            border-top: 1px solid #3388dd;
        }

        .oc-forest li::before {
            right: 50%;
        }

        .oc-forest li::after {
            left: 50%;
            border-left: 1px solid #3388dd;
        }

        .oc-forest li:first-child::before,
        .oc-forest li:last-child::after {
            border-top: none;
        }

        .oc-forest li:only-child::before {
            display: none;
        }

        .oc-forest li:only-child::after {
            border-top: none;
        }

        /* roots have no connector above them */
        .oc-forest > ul {
            padding-top: 0;
        }

        .oc-forest > ul > li {
            padding-top: 0;
            margin: 0 6px;
        }

        .oc-forest > ul > li::before,
        .oc-forest > ul > li::after {
            display: none;
        }

        /* vertical connector from a parent down to its children's bar */
        .oc-forest ul ul::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            height: 12px;
            border-left: 1px solid #3388dd;
        }

        .oc-node {
            text-align: center;
            vertical-align: middle;
            cursor: default;
            white-space: nowrap;
            padding: 2px 4px;
            border: 2px solid #b5d9ea;
            border-radius: 5px;
            box-shadow: rgba(0, 0, 0, 0.5) 3px 3px 3px;
            background-color: #edf7ff;
            background-image: linear-gradient(#edf7ff, #cde7ee);
            user-select: none;
        }

        .oc-node:hover {
            border-color: #6eb3d6;
        }

        .oc-node.oc-selected {
            background-color: #fff7ae;
            background-image: linear-gradient(#fff7ae, #eee79e);
            border-color: #e4e9b5;
        }

        .oc-node.oc-collapsed {
            border-style: double;
            border-width: 4px;
            border-color: #6eb3d6;
        }
    </style>

    <script>
        "use strict";

        // ------------------------------------------------------------------
        // Minimal replacements for ../util/messagingUtil.js and ../util/contentUtil.js
        // (only the functions this sample uses)
        // ------------------------------------------------------------------
        var va = {
            messagingUtil: {
                setOnDataReceivedCallback: function (callback) {
                    window.addEventListener("message", function (evt) {
                        if (evt && evt.data && evt.data.hasOwnProperty("data")) {
                            callback(evt.data);
                        }
                    }, false);
                },
                postSelectionMessage: function (resultName, selectedRows) {
                    var selections = selectedRows.map(function (s) {
                        return (typeof s === "object" && s.hasOwnProperty("row")) ? s : { row: s };
                    });
                    va.messagingUtil.postMessage({ resultName: resultName, selections: selections });
                },
                postInstructionalMessage: function (resultName, strMessage) {
                    va.messagingUtil.postMessage({ resultName: resultName, message: strMessage });
                },
                postMessage: function (objMessage) {
                    var url = (window.location != window.parent.location)
                        ? document.referrer
                        : document.location.href;
                    window.parent.postMessage(objMessage, url);
                }
            },
            contentUtil: {
                setupResizeListener: function (callback) {
                    var timeoutID = null;
                    window.addEventListener("resize", function () {
                        if (timeoutID) clearTimeout(timeoutID);
                        timeoutID = setTimeout(callback, 25);
                    });
                },
                validateRoles: function (resultData, expectedTypes, optionalTypes) {
                    var columnsInfo = resultData.columns;
                    var numCols = columnsInfo.length;
                    if (numCols < expectedTypes.length) return false;
                    for (var c = 0; c < expectedTypes.length; c++) {
                        if (columnsInfo[c].type !== expectedTypes[c]) return false;
                    }
                    if (numCols > expectedTypes.length) {
                        if (optionalTypes === null) return false;
                        if (typeof optionalTypes == "object") {
                            for (var c = expectedTypes.length, i = 0; c < numCols && i < optionalTypes.length; c++, i++) {
                                if (columnsInfo[c].type !== optionalTypes[i]) return false;
                            }
                        }
                        else {
                            for (var c = expectedTypes.length; c < numCols; c++) {
                                if (columnsInfo[c].type !== optionalTypes) return false;
                            }
                        }
                    }
                    return true;
                },
                // Removes the brush column (if any) and returns [{row: r}, ...] for brushed rows
                initializeSelections: function (resultData) {
                    if (!resultData) return null;
                    var columnsInfo = resultData.columns;
                    var arrayData = resultData.data;
                    var selections = [];
                    if (columnsInfo && arrayData) {
                        for (var c = 0; c < columnsInfo.length; c++) {
                            if (columnsInfo[c].usage && columnsInfo[c].usage === "brush") {
                                columnsInfo.splice(c, 1);
                                for (var r = 0; r < arrayData.length; r++) {
                                    if (arrayData[r][c] !== 0) selections.push({ row: r });
                                    arrayData[r].splice(c, 1);
                                }
                            }
                        }
                    }
                    return selections;
                }
            }
        };

        // ------------------------------------------------------------------
        // Minimal org chart renderer (replaces google.visualization.OrgChart)
        // Rows: { id, parent, html (formatted value or null), tooltip }
        // ------------------------------------------------------------------
        function OrgChart(container) {
            this._container = container;
            this._rows = [];
            this._selectedRow = null;
            this._collapsed = {}; // row index -> true
            this._onSelect = null;
        }

        OrgChart.prototype.setData = function (rows) {
            this._rows = rows;
            this._selectedRow = null;
            this._collapsed = {};
        };

        OrgChart.prototype.getSelection = function () {
            return (this._selectedRow === null) ? [] : [{ row: this._selectedRow }];
        };

        // Like Google OrgChart, only a single node can be selected
        OrgChart.prototype.setSelection = function (selection) {
            this._selectedRow = (selection && selection.length > 0) ? selection[0].row : null;
            this.draw();
        };

        OrgChart.prototype.draw = function () {
            var self = this;
            var rows = this._rows;

            // Index nodes by ID (first occurrence wins) and build child lists
            var indexById = {};
            rows.forEach(function (row, r) {
                if (!indexById.hasOwnProperty(row.id)) indexById[row.id] = r;
            });
            var children = rows.map(function () { return []; });
            var roots = [];
            rows.forEach(function (row, r) {
                if (indexById[row.id] !== r) return; // duplicate ID
                var p = indexById.hasOwnProperty(row.parent) ? indexById[row.parent] : -1;
                if (row.parent === "" || p === -1 || p === r) roots.push(r);
                else children[p].push(r);
            });

            var visited = {};
            function buildNode(r) {
                visited[r] = true;
                var row = rows[r];
                var li = document.createElement("li");
                var node = document.createElement("div");
                node.className = "oc-node";
                if (r === self._selectedRow) node.classList.add("oc-selected");
                if (row.html !== null) node.innerHTML = row.html;
                else node.textContent = row.id;
                if (row.tooltip) node.title = row.tooltip;

                node.addEventListener("click", function () {
                    self._selectedRow = (self._selectedRow === r) ? null : r;
                    self.draw();
                    if (self._onSelect) self._onSelect();
                });
                node.addEventListener("dblclick", function () {
                    if (children[r].length === 0) return;
                    if (self._collapsed[r]) delete self._collapsed[r];
                    else self._collapsed[r] = true;
                    self.draw();
                });
                li.appendChild(node);

                var kids = children[r].filter(function (k) { return !visited[k]; }); // guard against cycles
                if (kids.length > 0) {
                    if (self._collapsed[r]) {
                        node.classList.add("oc-collapsed");
                    }
                    else {
                        var ul = document.createElement("ul");
                        kids.forEach(function (k) { ul.appendChild(buildNode(k)); });
                        li.appendChild(ul);
                    }
                }
                return li;
            }

            var forest = document.createElement("div");
            forest.className = "oc-forest";
            var top = document.createElement("ul");
            roots.forEach(function (r) { top.appendChild(buildNode(r)); });
            forest.appendChild(top);

            this._container.innerHTML = "";
            this._container.appendChild(forest);
        };

        // ------------------------------------------------------------------
        // Number formatting for the tooltip role (replaces va.googleHelper.formatData)
        // ------------------------------------------------------------------
        function formatValue(value, colInfo) {
            if (value === null || value === undefined) return "";
            if (typeof value !== "number" || !colInfo || !colInfo.format) return String(value);
            var fmt = colInfo.format;
            var digits = fmt.precision || 0;
            switch (fmt.name) {
                case "DOLLAR":
                    return "$" + value.toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits });
                case "COMMA":
                    return value.toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits });
                case "F":
                    return value.toFixed(digits);
                case "PERCENT":
                    return value.toLocaleString("en-US", { style: "percent", maximumFractionDigits: digits });
                default:
                    return String(value);
            }
        }

        // ------------------------------------------------------------------
        // Sample logic (same flow as the Google-based sample)
        // ------------------------------------------------------------------

        va.messagingUtil.setOnDataReceivedCallback(onDataReceived);

        var _resultName = null;
        var _selections = null;
        var _chart = null;
        var _hasData = false;

        // By providing dummy data, the report designer is able to see the object
        // as a placeholder/template even before data is assigned to the Roles pane in Visual Analytics
        var _sampleRows = [
            { id: 'Mike', parent: '', html: 'Mike<div style="color:red; font-style:italic">President</div>', tooltip: 'The President' },
            { id: 'Jim', parent: 'Mike', html: 'Jim<div style="color:red; font-style:italic">Vice President</div>', tooltip: 'VP' },
            { id: 'Alice', parent: 'Mike', html: null, tooltip: '' },
            { id: 'Bob', parent: 'Jim', html: null, tooltip: 'Bob Sponge' },
            { id: 'Carol', parent: 'Bob', html: null, tooltip: '' }
        ];

        document.addEventListener("DOMContentLoaded", function () {
            _chart = new OrgChart(document.getElementById('chart_div'));
            _chart._onSelect = selectHandler;
            _chart.setData(_sampleRows);
            drawChart();
        });

        va.contentUtil.setupResizeListener(drawChart);

        function selectHandler() {
            var selection = _chart.getSelection();
            console.log(selection);
            if (_hasData) va.messagingUtil.postSelectionMessage(_resultName, selection);
        }

        function drawChart() {
            if (_chart) _chart.draw();
        }

        function onDataReceived(messageFromVA) {
            _resultName = messageFromVA.resultName;
            _selections = va.contentUtil.initializeSelections(messageFromVA);

            if (!va.contentUtil.validateRoles(messageFromVA, ["string", "string"], ["string"])) {
                va.messagingUtil.postInstructionalMessage(_resultName,
                    "Google OrgChart expects columns to be assigned in this order:\n" +
                    " 1. Node ID (string)\n" +
                    " 2. Parent ID (string)\n" +
                    " 3. Formatted Node ID (string, optional). An empty string means no formatted value\n" +
                    " 4. Tooltip (any type, optional)");
                return;
            }
            _hasData = true;
            _chart.setData(toOrgChartRows(messageFromVA));
            // Re-apply selections coming from VA (brushing)
            _chart.setSelection(_selections);
        }

        // Data transformation specific to this OrgChart
        // VA sends missing values as "(missing)" for string columns and "." for numeric columns
        function isMissing(value) {
            return value === null || value === undefined || value === "" || value === "(missing)" || value === ".";
        }

        function toOrgChartRows(messageFromVA) {
            var columns = messageFromVA.columns;
            var numCols = columns.length;
            return messageFromVA.data.map(function (dataRow) {
                var id = (dataRow[0] === null || dataRow[0] === undefined) ? "" : String(dataRow[0]);
                // At the highest level, there is no parent ID (= missing).
                // An empty string as the parent ID will prevent the node to be displayed with a missing value.
                var parent = isMissing(dataRow[1]) ? "" : String(dataRow[1]);
                // Optional format role (3rd column): HTML shown in the node. An empty/missing value means no formatted value.
                // You can use a calculated item in VA to derive this formatted value,
                // e.g.: 'Jim<div style="color:red; font-style:italic">Vice President</div>'
                var html = (numCols >= 3 && !isMissing(dataRow[2])) ? String(dataRow[2]) : null;
                // Optional tooltip role (4th column), numeric values are formatted using the VA format
                var tooltip = (numCols >= 4 && !isMissing(dataRow[3])) ? formatValue(dataRow[3], columns[3]) : "";
                return { id: id, parent: parent, html: html, tooltip: tooltip };
            });
        }

    </script>
</head>

<body>
    <div id="chart_div"></div>
</body>

</html>
